<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Manager — Student</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dash-wrap">
    <header class="dash-header">
      <h2>College Manager <span class="role-badge">Student</span></h2>
      <div><button id="themeToggleBtn" class="theme-toggle" onclick="toggleTheme()"></button><span id="userName"></span><button id="logoutBtn">Logout</button></div>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="attendance">Attendance</button>
      <button class="tab-btn" data-tab="routine">Routine</button>
      <button class="tab-btn" data-tab="notices">Notices</button>
      <button class="tab-btn" data-tab="profile">Profile</button>
      <button class="tab-btn" data-tab="documents">Documents</button>
    </nav>

    <!-- ATTENDANCE TAB -->
    <section id="tab-attendance" class="tab-content active">
      <div class="card">
        <h3>Mark Today's Attendance</h3>
        <p id="todayStatus" class="status-line"></p>
        <div class="btn-row">
          <button id="presentBtn" class="btn-success">Present</button>
          <button id="absentBtn" class="btn-danger">Absent</button>
        </div>
      </div>
      <div class="card">
        <h3>Your Attendance</h3>
        <p id="percentageResult" class="big-stat"></p>
      </div>
      <div class="card">
        <h3>History</h3>
        <div id="historyList"></div>
      </div>
    </section>

    <!-- ROUTINE TAB -->
    <section id="tab-routine" class="tab-content">
      <div class="card">
        <h3>Weekly Routine</h3>
        <div class="day-selector" id="daySelector"></div>
        <div id="routineDisplay"></div>
      </div>
    </section>

    <!-- NOTICES TAB -->
    <section id="tab-notices" class="tab-content">
      <div class="card">
        <h3>Notices</h3>
        <div id="noticesList"></div>
      </div>
    </section>

    <!-- PROFILE TAB -->
    <section id="tab-profile" class="tab-content">
      <div class="card">
        <h3>My Profile</h3>
        <form id="profileForm">
          <label>Full Name</label><input type="text" id="p_fullname">
          <label>Father's Name</label><input type="text" id="p_fathername">
          <label>Date of Birth</label><input type="date" id="p_dob">
          <label>Address</label><input type="text" id="p_address">
          <label>Phone</label><input type="tel" id="p_phone">
          <label>Email</label><input type="email" id="p_email">
          <label>Roll Number</label><input type="text" id="p_roll">
          <label>Semester</label><input type="text" id="p_semester">
          <label>Previous School (10th/12th)</label><input type="text" id="p_school">
          <label>10th Percentage</label><input type="text" id="p_tenth">
          <label>12th Percentage</label><input type="text" id="p_twelfth">
          <button type="submit">Save Profile</button>
          <p id="profileMsg" class="status-line"></p>
        </form>
      </div>
    </section>

    <!-- DOCUMENTS TAB -->
    <section id="tab-documents" class="tab-content">
      <div class="card">
        <h3>My Documents</h3>
        <form id="docForm">
          <label>Document Label (e.g. "10th Marksheet")</label>
          <input type="text" id="docLabel" required placeholder="10th Marksheet">
          <label>File (image or PDF)</label>
          <input type="file" id="docFile" accept="image/*,.pdf" required>
          <button type="submit">Upload</button>
          <p id="docMsg" class="status-line"></p>
        </form>
        <div id="docList" class="doc-list"></div>
      </div>
    </section>
  </div>

  <script src="theme.js"></script>
  <script src="chatbot.js"></script>
  <script>
    let myBranch = '';

    async function checkAuth() {
      const res = await fetch('/api/me');
      const data = await res.json();
      if (!data.loggedIn || data.user.role !== 'student') { window.location.href = '/index.html'; return; }
      document.getElementById('userName').textContent = data.user.name;
      myBranch = data.user.branch;
      loadAttendance(); loadRoutine(); loadNotices(); loadProfile(); loadDocuments();
    }
    checkAuth();

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/index.html';
    });

    // Tabs
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      });
    });

    // --- Attendance ---
    async function loadAttendance() {
      const statusRes = await fetch('/api/attendance/status');
      const statusData = await statusRes.json();
      const todayStatus = document.getElementById('todayStatus');
      const presentBtn = document.getElementById('presentBtn');
      const absentBtn = document.getElementById('absentBtn');
      if (statusData.record) {
        todayStatus.textContent = `Today: ${statusData.record.status} — ${statusData.record.approvalStatus}`;
        presentBtn.disabled = true; absentBtn.disabled = true;
      } else {
        todayStatus.textContent = 'Not marked yet today';
        presentBtn.disabled = false; absentBtn.disabled = false;
      }

      const summaryRes = await fetch('/api/attendance/summary');
      const summary = await summaryRes.json();
      document.getElementById('percentageResult').textContent =
        summary.percentage === null ? 'No approved records yet' : `${summary.percentage}% (${summary.present}/${summary.total} approved days)`;

      const historyRes = await fetch('/api/attendance/history');
      const history = await historyRes.json();
      const list = document.getElementById('historyList');
      list.innerHTML = history.history.length === 0 ? '<p class="muted">No records yet.</p>' :
        history.history.map(h => `<div class="history-row"><span>${h.date}</span><span>${h.status || '-'}</span><span class="badge badge-${h.approvalStatus}">${h.approvalStatus}</span></div>`).join('');
    }

    async function markAttendance(status) {
      const res = await fetch('/api/attendance/mark', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
      const data = await res.json();
      if (!res.ok) { alert(data.error); return; }
      loadAttendance();
    }
    document.getElementById('presentBtn').addEventListener('click', () => markAttendance('present'));
    document.getElementById('absentBtn').addEventListener('click', () => markAttendance('absent'));

    // --- Routine ---
    let routineData = {};
    async function loadRoutine() {
      const res = await fetch(`/api/routine/${myBranch}`);
      const data = await res.json();
      routineData = data.routine;
      const daysRes = await fetch('/api/days');
      const daysData = await daysRes.json();
      const selector = document.getElementById('daySelector');
      selector.innerHTML = daysData.days.map(d => `<button class="day-btn" data-day="${d}">${d}</button>`).join('');
      selector.querySelectorAll('.day-btn').forEach(btn => {
        btn.addEventListener('click', () => showDay(btn.dataset.day));
      });
      showDay(daysData.days[0]);
    }
    function showDay(day) {
      document.querySelectorAll('.day-btn').forEach(b => b.classList.toggle('active', b.dataset.day === day));
      const periods = routineData[day] || [];
      const display = document.getElementById('routineDisplay');
      if (periods.length === 0) { display.innerHTML = '<p class="muted">No routine set for this day yet.</p>'; return; }
      display.innerHTML = periods.map((p, i) => `<div class="routine-row"><span>Period ${i + 1}</span><span>${p || '-'}</span></div>`).join('');
    }

    // --- Notices ---
    async function loadNotices() {
      const res = await fetch(`/api/notices/${myBranch}`);
      const data = await res.json();
      const list = document.getElementById('noticesList');
      list.innerHTML = data.notices.length === 0 ? '<p class="muted">No notices yet.</p>' :
        data.notices.map(n => `<div class="notice-item"><p>${n.text}</p><small>${new Date(n.date).toLocaleString()} — ${n.postedBy}</small></div>`).join('');
    }

    // --- Profile ---
    async function loadProfile() {
      const res = await fetch('/api/profile');
      const data = await res.json();
      if (!data.profile) return;
      const p = data.profile;
      document.getElementById('p_fullname').value = p.fullname || '';
      document.getElementById('p_fathername').value = p.fathername || '';
      document.getElementById('p_dob').value = p.dob || '';
      document.getElementById('p_address').value = p.address || '';
      document.getElementById('p_phone').value = p.phone || '';
      document.getElementById('p_email').value = p.email || '';
      document.getElementById('p_roll').value = p.roll || '';
      document.getElementById('p_semester').value = p.semester || '';
      document.getElementById('p_school').value = p.school || '';
      document.getElementById('p_tenth').value = p.tenth || '';
      document.getElementById('p_twelfth').value = p.twelfth || '';
    }
    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        fullname: document.getElementById('p_fullname').value,
        fathername: document.getElementById('p_fathername').value,
        dob: document.getElementById('p_dob').value,
        address: document.getElementById('p_address').value,
        phone: document.getElementById('p_phone').value,
        email: document.getElementById('p_email').value,
        roll: document.getElementById('p_roll').value,
        semester: document.getElementById('p_semester').value,
        school: document.getElementById('p_school').value,
        tenth: document.getElementById('p_tenth').value,
        twelfth: document.getElementById('p_twelfth').value
      };
      const res = await fetch('/api/profile', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
      });
      document.getElementById('profileMsg').textContent = res.ok ? 'Saved!' : 'Error saving profile';
    });

    // --- Documents ---
    async function loadDocuments() {
      const res = await fetch('/api/documents');
      const data = await res.json();
      const list = document.getElementById('docList');
      list.innerHTML = data.documents.length === 0 ? '<p class="muted">No documents uploaded yet.</p>' :
        data.documents.map(d => `
          <div class="doc-item">
            <span>${d.label}</span>
            <div>
              <a href="/uploads/${d.filename}" target="_blank">View</a>
              <button class="btn-danger-small" onclick="deleteDoc('${d.filename}')">Delete</button>
            </div>
          </div>`).join('');
    }
    async function deleteDoc(filename) {
      if (!confirm('Delete this document?')) return;
      await fetch(`/api/documents/${filename}`, { method: 'DELETE' });
      loadDocuments();
    }
    document.getElementById('docForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById('docFile');
      if (!fileInput.files[0]) return;
      const formData = new FormData();
      formData.append('document', fileInput.files[0]);
      formData.append('label', document.getElementById('docLabel').value);
      const res = await fetch('/api/documents', { method: 'POST', body: formData });
      document.getElementById('docMsg').textContent = res.ok ? 'Uploaded!' : 'Upload failed';
      if (res.ok) { fileInput.value = ''; document.getElementById('docLabel').value = ''; loadDocuments(); }
    });
  </script>
</body>
</html>
