<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Manager — Register</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-wrap">
    <button id="themeToggleBtn" class="theme-toggle top-corner-toggle" onclick="toggleTheme()"></button>
    <div class="auth-card">
      <h1>College Manager</h1>
      <p class="subtitle">Create your student account</p>

      <form id="registerForm">
        <label>Full Name</label>
        <input type="text" id="name" required placeholder="Your Name">

        <label>Username</label>
        <input type="text" id="username" required placeholder="choose_a_username">

        <label>Password</label>
        <input type="password" id="password" required placeholder="At least 6 characters">

        <label>Branch</label>
        <select id="branch" required>
          <option value="">Select branch</option>
        </select>

        <button type="submit">Create Account</button>
        <p id="error" class="error"></p>
      </form>

      <p class="switch">Already have an account? <a href="/index.html">Login</a></p>
    </div>
  </div>

  <script src="theme.js"></script>
  <script>
    async function loadBranches() {
      const res = await fetch('/api/branches');
      const data = await res.json();
      const sel = document.getElementById('branch');
      data.branches.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b; opt.textContent = b;
        sel.appendChild(opt);
      });
    }
    loadBranches();

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const branch = document.getElementById('branch').value;
      const errorEl = document.getElementById('error');
      errorEl.textContent = '';
      try {
        const res = await fetch('/api/register', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, username, password, branch })
        });
        const data = await res.json();
        if (!res.ok) { errorEl.textContent = data.error || 'Registration failed'; return; }
        window.location.href = '/student.html';
      } catch (err) { errorEl.textContent = 'Network error. Try again.'; }
    });
  </script>
</body>
</html>
