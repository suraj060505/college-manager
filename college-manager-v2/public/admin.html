<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Manager — Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dash-wrap">
    <header class="dash-header">
      <h2>College Manager <span class="role-badge role-admin">Admin</span></h2>
      <div><button id="themeToggleBtn" class="theme-toggle" onclick="toggleTheme()"></button><span id="userName"></span><button id="logoutBtn">Logout</button></div>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="users">Manage Users</button>
      <button class="tab-btn" data-tab="override">Attendance Override</button>
      <button class="tab-btn" data-tab="notice">Post Notice</button>
      <button class="tab-btn" data-tab="routine">Edit Routine</button>
      <button class="tab-btn" data-tab="audit">Audit Log</button>
    </nav>

    <!-- USERS -->
    <section id="tab-users" class="tab-content active">
      <div class="card">
        <h3>Add Teacher / Admin</h3>
        <form id="addUserForm">
          <label>Full Name</label><input type="text" id="u_name" required>
          <label>Username</label><input type="text" id="u_username" required>
          <label>Password</label><input type="password" id="u_password" required>
          <label>Branch</label>
          <select id="u_branch" required><option value="">Select</option><option value="ALL">ALL</option></select>
          <label>Role</label>
          <select id="u_role" required><option value="teacher">Teacher</option><option value="admin">Admin</option></select>
          <button type="submit">Add User</button>
          <p id="addUserMsg" class="status-line"></p>
        </form>
      </div>
      <div class="card">
        <h3>All Users</h3>
        <div id="usersList"></div>
      </div>
    </section>

    <!-- OVERRIDE -->
    <section id="tab-override" class="tab-content">
      <div class="card">
        <h3>Attendance Override</h3>
        <p class="muted">Locked (approved) records can only be changed here. Every override is logged.</p>
        <form id="overrideForm">
          <label>Student Username</label><input type="text" id="o_username" required>
          <label>Date</label><input type="date" id="o_date" required>
          <div class="btn-row">
            <button type="button" class="btn-success" onclick="submitOverride('present')">Set Present</button>
            <button type="button" class="btn-danger" onclick="submitOverride('absent')">Set Absent</button>
          </div>
          <p id="overrideMsg" class="status-line"></p>
        </form>
      </div>
    </section>

    <!-- NOTICE -->
    <section id="tab-notice" class="tab-content">
      <div class="card">
        <h3>Post Notice (to ALL branches)</h3>
        <form id="noticeForm">
          <textarea id="noticeText" rows="4" required placeholder="Write notice here..."></textarea>
          <button type="submit">Post to All Branches</button>
          <p id="noticeMsg" class="status-line"></p>
        </form>
      </div>
    </section>

    <!-- ROUTINE -->
    <section id="tab-routine" class="tab-content">
      <div class="card">
        <h3>Edit Routine</h3>
        <form id="routineForm">
          <label>Branch</label>
          <select id="r_branch" required></select>
          <label>Day</label>
          <select id="r_day" required></select>
          <label>Period I</label><input type="text" id="r_p1">
          <label>Period II</label><input type="text" id="r_p2">
          <label>Period III</label><input type="text" id="r_p3">
          <label>Period IV</label><input type="text" id="r_p4">
          <label>Period V</label><input type="text" id="r_p5">
          <label>Period VI</label><input type="text" id="r_p6">
          <button type="submit">Save Routine</button>
          <p id="routineMsg" class="status-line"></p>
        </form>
      </div>
    </section>

    <!-- AUDIT -->
    <section id="tab-audit" class="tab-content">
      <div class="card">
        <h3>Audit Log (Attendance Overrides)</h3>
        <div id="auditList"></div>
      </div>
    </section>
  </div>

  <script src="theme.js"></script>
  <script src="chatbot.js"></script>
  <script>
    async function checkAuth() {
      const res = await fetch('/api/me');
      const data = await res.json();
      if (!data.loggedIn || data.user.role !== 'admin') { window.location.href = '/index.html'; return; }
      document.getElementById('userName').textContent = data.user.name;
      loadBranches(); loadUsers(); loadAudit();
    }
    checkAuth();

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/index.html';
    });

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      });
    });

    async function loadBranches() {
      const res = await fetch('/api/branches');
      const data = await res.json();
      const uBranch = document.getElementById('u_branch');
      const rBranch = document.getElementById('r_branch');
      data.branches.forEach(b => {
        uBranch.appendChild(new Option(b, b));
        rBranch.appendChild(new Option(b, b));
      });
      const daysRes = await fetch('/api/days');
      const daysData = await daysRes.json();
      const rDay = document.getElementById('r_day');
      daysData.days.forEach(d => rDay.appendChild(new Option(d, d)));
    }

    // --- Users ---
    async function loadUsers() {
      const res = await fetch('/api/admin/users');
      const data = await res.json();
      document.getElementById('usersList').innerHTML = data.users.map(u => `
        <div class="user-row">
          <span>${u.name} (${u.username}) — ${u.role} — ${u.branch}</span>
          ${u.username !== 'admin' ? `<button class="btn-danger-small" onclick="removeUser('${u.username}')">Remove</button>` : ''}
        </div>`).join('');
    }
    async function removeUser(username) {
      if (!confirm(`Remove user ${username}?`)) return;
      await fetch(`/api/admin/users/${username}`, { method: 'DELETE' });
      loadUsers();
    }
    document.getElementById('addUserForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        name: document.getElementById('u_name').value,
        username: document.getElementById('u_username').value,
        password: document.getElementById('u_password').value,
        branch: document.getElementById('u_branch').value,
        role: document.getElementById('u_role').value
      };
      const res = await fetch('/api/admin/users', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const data = await res.json();
      document.getElementById('addUserMsg').textContent = res.ok ? 'User added!' : (data.error || 'Failed');
      if (res.ok) { e.target.reset(); loadUsers(); }
    });

    // --- Override ---
    async function submitOverride(status) {
      const username = document.getElementById('o_username').value;
      const date = document.getElementById('o_date').value;
      if (!username || !date) { document.getElementById('overrideMsg').textContent = 'Enter username and date'; return; }
      const res = await fetch('/api/admin/override', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, date, status }) });
      const data = await res.json();
      document.getElementById('overrideMsg').textContent = res.ok ? 'Overridden and logged.' : (data.error || 'Failed');
      loadAudit();
    }

    // --- Notice ---
    document.getElementById('noticeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = document.getElementById('noticeText').value;
      const res = await fetch('/api/notices', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
      document.getElementById('noticeMsg').textContent = res.ok ? 'Posted to all branches!' : 'Failed';
      if (res.ok) document.getElementById('noticeText').value = '';
    });

    // --- Routine ---
    document.getElementById('routineForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const branch = document.getElementById('r_branch').value;
      const day = document.getElementById('r_day').value;
      const periods = ['r_p1', 'r_p2', 'r_p3', 'r_p4', 'r_p5', 'r_p6'].map(id => document.getElementById(id).value);
      const res = await fetch(`/api/routine/${branch}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ day, periods }) });
      document.getElementById('routineMsg').textContent = res.ok ? 'Routine saved!' : 'Failed';
    });

    // --- Audit ---
    async function loadAudit() {
      const res = await fetch('/api/admin/audit');
      const data = await res.json();
      document.getElementById('auditList').innerHTML = data.audit.length === 0 ? '<p class="muted">No overrides logged yet.</p>' :
        data.audit.map(a => `
          <div class="audit-row">
            <small>${new Date(a.timestamp).toLocaleString()}</small>
            <p><b>${a.admin}</b> overrode <b>${a.target}</b>'s attendance for ${a.date}</p>
          </div>`).join('');
    }
  </script>
</body>
</html>
