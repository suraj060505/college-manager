<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Manager — Teacher</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dash-wrap">
    <header class="dash-header">
      <h2>College Manager <span class="role-badge role-teacher">Teacher</span></h2>
      <div><button id="themeToggleBtn" class="theme-toggle" onclick="toggleTheme()"></button><span id="userName"></span><button id="logoutBtn">Logout</button></div>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="approvals">Pending Approvals</button>
      <button class="tab-btn" data-tab="notice">Post Notice</button>
      <button class="tab-btn" data-tab="routine">Routine</button>
    </nav>

    <section id="tab-approvals" class="tab-content active">
      <div class="card">
        <h3>Today's Pending Attendance — <span id="branchLabel"></span></h3>
        <div id="pendingList"></div>
        <p id="noPending" class="muted" style="display:none">No pending submissions right now.</p>
      </div>
    </section>

    <section id="tab-notice" class="tab-content">
      <div class="card">
        <h3>Post a Notice (to your branch)</h3>
        <form id="noticeForm">
          <textarea id="noticeText" rows="4" required placeholder="Write notice here..."></textarea>
          <button type="submit">Post Notice</button>
          <p id="noticeMsg" class="status-line"></p>
        </form>
      </div>
    </section>

    <section id="tab-routine" class="tab-content">
      <div class="card">
        <h3>View Routine</h3>
        <div class="day-selector" id="daySelector"></div>
        <div id="routineDisplay"></div>
      </div>
    </section>
  </div>

  <script src="theme.js"></script>
  <script src="chatbot.js"></script>
  <script>
    let myBranch = '';

    async function checkAuth() {
      const res = await fetch('/api/me');
      const data = await res.json();
      if (!data.loggedIn || data.user.role !== 'teacher') { window.location.href = '/index.html'; return; }
      document.getElementById('userName').textContent = data.user.name;
      myBranch = data.user.branch;
      document.getElementById('branchLabel').textContent = myBranch;
      loadPending(); loadRoutine();
    }
    checkAuth();

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/index.html';
    });

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      });
    });

    async function loadPending() {
      const res = await fetch(`/api/teacher/pending?branch=${encodeURIComponent(myBranch)}`);
      const data = await res.json();
      const list = document.getElementById('pendingList');
      const noPending = document.getElementById('noPending');
      if (data.pending.length === 0) { list.innerHTML = ''; noPending.style.display = 'block'; return; }
      noPending.style.display = 'none';
      list.innerHTML = data.pending.map(username => `
        <div class="pending-row">
          <span>${username}</span>
          <div>
            <button class="btn-success-small" onclick="approve('${username}')">Approve</button>
            <button class="btn-danger-small" onclick="reject('${username}')">Reject</button>
          </div>
        </div>`).join('');
    }
    async function approve(username) {
      await fetch('/api/teacher/approve', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username }) });
      loadPending();
    }
    async function reject(username) {
      await fetch('/api/teacher/reject', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username }) });
      loadPending();
    }

    document.getElementById('noticeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = document.getElementById('noticeText').value;
      const res = await fetch('/api/notices', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
      document.getElementById('noticeMsg').textContent = res.ok ? 'Posted!' : 'Failed to post';
      if (res.ok) document.getElementById('noticeText').value = '';
    });

    let routineData = {};
    async function loadRoutine() {
      const res = await fetch(`/api/routine/${myBranch}`);
      const data = await res.json();
      routineData = data.routine;
      const daysRes = await fetch('/api/days');
      const daysData = await daysRes.json();
      const selector = document.getElementById('daySelector');
      selector.innerHTML = daysData.days.map(d => `<button class="day-btn" data-day="${d}">${d}</button>`).join('');
      selector.querySelectorAll('.day-btn').forEach(btn => btn.addEventListener('click', () => showDay(btn.dataset.day)));
      showDay(daysData.days[0]);
    }
    function showDay(day) {
      document.querySelectorAll('.day-btn').forEach(b => b.classList.toggle('active', b.dataset.day === day));
      const periods = routineData[day] || [];
      const display = document.getElementById('routineDisplay');
      display.innerHTML = periods.length === 0 ? '<p class="muted">No routine set.</p>' :
        periods.map((p, i) => `<div class="routine-row"><span>Period ${i + 1}</span><span>${p || '-'}</span></div>`).join('');
    }
  </script>
</body>
</html>
